<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>SLIME VANIA VFX LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade test cabinet for attack effects — dark, gold trim, the screen is the star
   IDEA: a 16bit "sound test" style VFX room: pick a move, hit the dummy, tune the knobs
   PICTURE: the 384x216 pixel canvas, scaled up crisp, filling the top of the screen
   COLOUR and TYPE: #07060c night, #b59a55 old gold, effect colours do the talking; DotGothic16
   LAYOUT: screen on top, move chips, then thumbs (move / jump / attack); settings in a drawer */
:root{color-scheme:dark;--gold:#b59a55;--gold2:#e6cf8f;--ink:#e9e3cf;--bg:#07060c}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:'DotGothic16','Hiragino Kaku Gothic ProN',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  height:100dvh;display:grid;grid-template-rows:auto auto 1fr;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#stage{position:relative;width:min(100%,calc(62dvh*16/9));max-width:1100px;margin:0 auto;aspect-ratio:16/9;max-height:62dvh;}
@media (orientation:portrait){#stage{aspect-ratio:auto;height:min(60dvh,118vw);max-height:none}}
#stage{background:#000;display:grid;place-items:center}
#cv{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#hud{position:absolute;left:8px;top:6px;font-size:13px;color:var(--gold2);text-shadow:0 1px 0 #000;pointer-events:none;line-height:1.4}
#hud b{font-weight:400;color:#fff}
#gear{position:absolute;right:8px;top:6px;width:44px;height:44px;border-radius:10px;border:1px solid #b59a5599;background:#0a0812aa;color:var(--gold2);font-size:22px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scroll-snap-type:x mandatory;max-width:1100px;width:100%;margin:0 auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;min-height:44px;padding:4px 12px;border-radius:22px;border:1px solid #6b5a33;background:#15121f;color:var(--ink);font:15px/1.2 inherit;white-space:nowrap}
.chip small{color:#9a8f73;margin-right:4px}
.chip.on{background:linear-gradient(180deg,#e6cf8f,#b59a55);color:#1a1424;border-color:#e6cf8f}
.chip.on small{color:#3a2a10}
#pad{display:flex;justify-content:space-between;align-items:center;align-self:center;padding:6px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto}
.grp{display:flex;gap:12px;align-items:center}
.btn{width:64px;height:64px;border-radius:50%;border:2px solid #0008;font:17px/1 inherit;color:#fff;box-shadow:0 4px 0 #0008,inset 0 2px 0 #fff4;touch-action:none}
.btn.on{transform:translateY(3px) scale(.92);filter:brightness(1.35);box-shadow:0 0 0 3px #fff6,0 0 18px #fff6}
#bl,#br{background:radial-gradient(circle at 35% 30%,#666,#2a2a33);border-radius:14px}
#bj{background:radial-gradient(circle at 35% 28%,#a8f0b0,#3fa45a 60%,#23663a)}
#ba{width:84px;height:84px;font-size:20px;background:radial-gradient(circle at 35% 28%,#ff8a6a,#d8402a 60%,#8a2014)}
#keys{display:none;text-align:center;font-size:13px;color:#9a8f73;padding:6px}
@media (hover:hover) and (pointer:fine){#pad{display:none}#keys{display:block}}
@media (orientation:landscape) and (max-height:520px){
  body{grid-template-rows:1fr auto;padding:0}
  #stage{max-height:none;height:100dvh;width:auto;aspect-ratio:16/9;grid-row:1/3;grid-column:1}
  #chips{grid-row:2;grid-column:1;position:fixed;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom,0px));justify-content:center;background:none;pointer-events:none}
  .chip{pointer-events:auto;opacity:.8;min-height:36px;font-size:13px}
  #pad{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;margin:0;pointer-events:none;max-width:none;padding:0 max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));align-items:flex-end}
  .btn{pointer-events:auto;opacity:.6}}
#tune{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#04030acc;padding:16px}
#tune.open{display:flex}
.panel{width:min(94vw,420px);max-height:100%;overflow:auto;background:#141226;border:2px solid var(--gold);border-radius:14px;padding:16px 18px}
.panel h2{margin:0 0 10px;font-size:20px;font-weight:400;color:var(--gold2);text-align:center}
.row{display:grid;grid-template-columns:7.5em 1fr 3.2em;align-items:center;gap:8px;min-height:44px}
.row output{text-align:right;color:#fff}
input[type=range]{width:100%;accent-color:#e6cf8f;height:28px}
.tg{display:flex;gap:10px;margin-top:8px}
.tg button,.close{flex:1;min-height:46px;border-radius:10px;border:1px solid #6b5a33;background:#1f1b2e;color:var(--ink);font:15px inherit}
.tg button.on{background:#e6cf8f;color:#1a1424}
.close{width:100%;margin-top:12px;background:linear-gradient(180deg,#e6cf8f,#b59a55);color:#1a1424}
.note{font-size:13px;color:#9a8f73;line-height:1.6;margin:10px 0 0}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="384" height="216"></canvas>
  <div id="hud"><b id="hName">1 通常攻撃</b><br><span id="hInfo">X / 赤ボタンで攻撃</span></div>
  <button id="gear" aria-label="調整">⚙</button></div>
<div id="chips"></div>
<div id="pad">
  <div class="grp"><button class="btn" id="bl">◀</button><button class="btn" id="br">▶</button></div>
  <div class="grp"><button class="btn" id="bj">JUMP</button><button class="btn" id="ba">攻撃</button></div>
</div>
<div id="keys">←→ 移動 ／ Z ジャンプ ／ X 攻撃 ／ 1〜9・0・-・^ でエフェクト選択（Q／E で前後）／ G 調整パネル</div>
<div id="tune"><div class="panel">
  <h2>エフェクト調整</h2>
  <div class="row"><span>威力</span><input type="range" id="sPow" min="0.5" max="2" step="0.1" value="1"><output id="oPow">1.0</output></div>
  <div class="row"><span>色（色相）</span><input type="range" id="sHue" min="-180" max="180" step="10" value="0"><output id="oHue">0°</output></div>
  <div class="row"><span>粒子の数</span><input type="range" id="sCnt" min="0.3" max="2" step="0.1" value="1"><output id="oCnt">1.0</output></div>
  <div class="row"><span>演出時間</span><input type="range" id="sTim" min="0.5" max="2" step="0.1" value="1"><output id="oTim">1.0</output></div>
  <div class="tg"><button id="tShake" class="on">画面ゆれ ON</button><button id="tFlash" class="on">強い光 ON</button></div>
  <p class="note">「強い光 OFF」で画面全体の白い閃光・暗転を弱めます（光に敏感な人向け）。設定はこの端末に保存されます。</p>
  <button class="close" id="tClose">とじる</button>
</div></div>
<script>
'use strict';
{
/* =====================================================================
   PixelVFX — ゲームに移植できる独立エフェクトクラス
   ・描画先は低解像度のキャンバス（ドット感を保つため imageSmoothing は切る）
   ・粒子／リング／斬撃／稲妻／光線／残像はすべてオブジェクトプール
   ・加算合成（lighter）で 白→黄→橙 の多層発光
   ・ゲーム側は spawn 系の関数を呼び、毎フレーム update() と draw(ctx,camX,camY) を呼ぶだけ
   ===================================================================== */
class PixelVFX{
  constructor(opts={}){
    this.set=Object.assign({power:1,hue:0,count:1,time:1,shake:true,flash:true},opts.settings||{});
    this.P=[];for(let i=0;i<(opts.particles||2400);i++)this.P.push({on:false});this.pi=0;
    this.R=[];for(let i=0;i<64;i++)this.R.push({on:false});
    this.S=[];for(let i=0;i<32;i++)this.S.push({on:false});
    this.B=[];for(let i=0;i<24;i++)this.B.push({on:false});
    this.L=[];for(let i=0;i<12;i++)this.L.push({on:false});
    this.A=[];for(let i=0;i<48;i++)this.A.push({on:false});
    this.CR=[];for(let i=0;i<24;i++)this.CR.push({on:false});
    this.screen={shake:0,flash:0,flashCol:'#ffffff',dark:0,darkT:0,zoom:0,hitstop:0};
    this.glowC=new Map();this.hueC=new Map();
  }
  /* ---------- colour helpers: hue slider rotates every saturated colour, whites stay white ---------- */
  hc(hex){if(!this.set.hue)return hex;const k=hex+this.set.hue;let v=this.hueC.get(k);if(v)return v;
    const n=parseInt(hex.slice(1),16);let r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}
    if(s<.18){this.hueC.set(k,hex);return hex;}
    h=(h+this.set.hue/360+1)%1;const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};
    v='#'+[f(h+1/3),f(h),f(h-1/3)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');this.hueC.set(k,v);return v;}
  /* stepped (banded) radial light, so glow keeps a pixel-art look instead of a smooth blur */
  glowSpr(col,r){const k=col+r;let c=this.glowC.get(k);if(c)return c;c=document.createElement('canvas');c.width=c.height=r*2;const g=c.getContext('2d');
    const n=parseInt(col.slice(1),16),R=n>>16,G=n>>8&255,B=n&255,im=g.createImageData(r*2,r*2);
    for(let y=0;y<r*2;y++)for(let x=0;x<r*2;x++){const d=Math.hypot(x-r+.5,y-r+.5)/r;let a=d<.25?.85:d<.5?.45:d<.75?.2:d<1?.07:0;
      if(d>=.5&&d<1&&((x+y)&1)&&d>.62)a*=.5;const i=(y*r*2+x)*4;im.data[i]=R;im.data[i+1]=G;im.data[i+2]=B;im.data[i+3]=a*255;}
    g.putImageData(im,0,0);this.glowC.set(k,c);return c;}
  get k(){return this.set.count;} get tm(){return this.set.time;}
  /* ---------- particles ---------- */
  p(o){const P=this.P;for(let n=0;n<P.length;n++){this.pi=(this.pi+1)%P.length;const q=P[this.pi];if(!q.on){
      q.on=true;q.x=o.x;q.y=o.y;q.vx=o.vx||0;q.vy=o.vy||0;q.ax=o.ax||0;q.ay=o.ay===undefined?0:o.ay;q.drag=o.drag===undefined?1:o.drag;
      q.max=q.life=Math.max(1,Math.round((o.life||20)*this.tm));q.cols=(o.cols||['#ffffff']).map(c=>this.hc(c));q.shape=o.shape||'px';q.size=o.size||1;q.size1=o.size1===undefined?q.size:o.size1;
      q.add=o.add!==false;q.rot=o.rot||0;q.vr=o.vr||0;q.flick=o.flick||0;return q;}}return null;}
  burst(x,y,n,o){n=Math.round(n*this.k);for(let i=0;i<n;i++){const a=(o.dir!==undefined?o.dir+(Math.random()-.5)*(o.spread||6.28):Math.random()*6.28),s=(o.spd||2)*(.35+Math.random()*.65);
      this.p(Object.assign({},o,{x:x+(Math.random()-.5)*(o.jit||0),y:y+(Math.random()-.5)*(o.jit||0),vx:Math.cos(a)*s+(o.vx0||0),vy:Math.sin(a)*s+(o.vy0||0),life:(o.life||20)*(.6+Math.random()*.4)}));}}
  /* converge: particles fly from a circle into the point (wind-up / charge) */
  converge(x,y,n,rad,o){n=Math.round(n*this.k);for(let i=0;i<n;i++){const a=Math.random()*6.28,r=rad*(.6+Math.random()*.4),L=o.life||14;
      this.p(Object.assign({},o,{x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:-Math.cos(a)*r/L,vy:-Math.sin(a)*r/L,life:L,shape:o.shape||'spark'}));}}
  /* ---------- rings / shockwaves (squash < 1 makes a ground-hugging ellipse) ---------- */
  ring(o){for(const r of this.R)if(!r.on){Object.assign(r,{on:true,x:o.x,y:o.y,r:o.r0||2,r1:o.r1||30,t:0,max:Math.round((o.life||16)*this.tm),cols:(o.cols||['#ffffff','#ffe070','#ff8a30']).map(c=>this.hc(c)),sq:o.sq||1,th:o.th||3,arc:o.arc||null});return r;}}
  /* ---------- crescent slash: a tapered arc, white edge → yellow → orange, with lagging after-images ---------- */
  slash(o){for(const s of this.S)if(!s.on){Object.assign(s,{on:true,x:o.x,y:o.y,dir:o.dir||1,a0:o.a0,a1:o.a1,r:o.r||22,w:o.w||5,t:0,max:Math.round((o.life||12)*this.tm),
      cols:(o.cols||['#ffffff','#fff2a0','#ffb040','#ff6a20']).map(c=>this.hc(c)),ghosts:o.ghosts===undefined?3:o.ghosts,follow:o.follow||null,ox:o.x,oy:o.y});return s;}}
  /* ---------- lightning: jagged polyline re-rolled every 2 frames, with branches ---------- */
  bolt(o){for(const b of this.B)if(!b.on){Object.assign(b,{on:true,x0:o.x0,y0:o.y0,x1:o.x1,y1:o.y1,t:0,max:Math.round((o.life||12)*this.tm),pts:null,br:[],cols:(o.cols||['#ffffff','#bfe8ff','#5aa8ff']).map(c=>this.hc(c)),jag:o.jag||10});return b;}}
  /* ---------- beam: a layered energy bar (horizontal) ---------- */
  beam(o){for(const l of this.L)if(!l.on){Object.assign(l,{on:true,x:o.x,y:o.y,len:o.len||200,dir:o.dir||1,w:o.w||10,t:0,max:Math.round((o.life||28)*this.tm),cols:(o.cols||['#ffffff','#bff8ff','#49c8ff','#2a5aff']).map(c=>this.hc(c))});return l;}}
  /* ---------- after-images: the caller passes a draw function that paints a silhouette ---------- */
  ghost(o){for(const a of this.A)if(!a.on){Object.assign(a,{on:true,x:o.x,y:o.y,dir:o.dir,t:0,max:o.life||12,col:this.hc(o.col||'#7ad8ff'),fn:o.fn,sx:o.sx||1,sy:o.sy||1});return a;}}
  /* ---------- ice crystals growing out of the floor ---------- */
  crystal(o){for(const c of this.CR)if(!c.on){Object.assign(c,{on:true,x:o.x,y:o.y,h:o.h||28,w:o.w||7,lean:o.lean||0,t:0,grow:o.grow||8,max:Math.round((o.life||40)*this.tm),shattered:false});return c;}}
  shatter(c){c.shattered=true;const n=Math.round(16*this.k);for(let i=0;i<n;i++){const yy=c.y-Math.random()*c.h;
      this.p({x:c.x+(Math.random()-.5)*c.w,y:yy,vx:(Math.random()-.5)*3.2,vy:-Math.random()*3-1,ay:.18,drag:.98,life:30,cols:['#ffffff','#d8f6ff','#8fd8ff','#4a8ad8'],shape:'shard',size:2+Math.random()*2,rot:Math.random()*6,vr:(Math.random()-.5)*.5,add:false});}
    this.burst(c.x,c.y-c.h/2,10,{spd:1,cols:['#e8fbff','#a6ecff'],life:26,shape:'smoke',size:3,size1:8,add:false,ay:-.02,drag:.96});}
  /* ---------- screen-wide feedback ---------- */
  shake(a){if(this.set.shake)this.screen.shake=Math.max(this.screen.shake,a);}
  flash(a,col){const lim=this.set.flash?1:.18;this.screen.flash=Math.max(this.screen.flash,Math.min(a,lim));this.screen.flashCol=col||'#ffffff';}
  darken(a,t){this.screen.dark=Math.max(this.screen.dark,this.set.flash?a:a*.45);this.screen.darkT=t;}
  hitstop(ms){this.screen.hitstop=Math.max(this.screen.hitstop,Math.round(Math.min(80,Math.max(30,ms))/16.7));}
  /* ================= update ================= */
  update(){const sc=this.screen;sc.shake*=.86;if(sc.shake<.2)sc.shake=0;sc.flash*=.8;if(sc.flash<.01)sc.flash=0;sc.zoom*=.85;
    if(sc.darkT>0)sc.darkT--;else{sc.dark*=.9;if(sc.dark<.01)sc.dark=0;}
    for(const q of this.P){if(!q.on)continue;q.vx=(q.vx+q.ax)*q.drag;q.vy=(q.vy+q.ay)*q.drag;q.x+=q.vx;q.y+=q.vy;q.rot+=q.vr;if(--q.life<=0)q.on=false;}
    for(const r of this.R)if(r.on&&++r.t>=r.max)r.on=false;
    for(const s of this.S)if(s.on){if(s.follow){s.x=s.follow.x+s.ox;s.y=s.follow.y+s.oy;}if(++s.t>=s.max)s.on=false;}
    for(const b of this.B)if(b.on){if(b.t%2===0)this.reroll(b);if(++b.t>=b.max)b.on=false;}
    for(const l of this.L)if(l.on&&++l.t>=l.max)l.on=false;
    for(const a of this.A)if(a.on&&++a.t>=a.max)a.on=false;
    for(const c of this.CR)if(c.on){c.t++;if(c.t>=c.max&&!c.shattered)this.shatter(c);if(c.t>=c.max+2)c.on=false;}}
  reroll(b){const n=Math.max(4,Math.round(Math.hypot(b.x1-b.x0,b.y1-b.y0)/7)),pts=[];
    for(let i=0;i<=n;i++){const u=i/n,j=(i===0||i===n)?0:(Math.random()-.5)*b.jag;pts.push([b.x0+(b.x1-b.x0)*u+j,b.y0+(b.y1-b.y0)*u+(Math.random()-.5)*2]);}
    b.pts=pts;b.br=[];for(let i=2;i<n-1;i++)if(Math.random()<.28){const [x,y]=pts[i],L=6+Math.random()*14,a=Math.atan2(b.y1-b.y0,b.x1-b.x0)+(Math.random()<.5?-1:1)*(.5+Math.random()*.7);
      b.br.push([[x,y],[x+Math.cos(a)*L*.5+(Math.random()-.5)*4,y+Math.sin(a)*L*.5],[x+Math.cos(a)*L,y+Math.sin(a)*L]]);}}
  /* ================= draw ================= */
  px(g,x,y,c){g.fillStyle=c;g.fillRect(x|0,y|0,1,1);}
  line(g,x0,y0,x1,y1,c){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;g.fillStyle=c;
    for(let n=0;n<600;n++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
  glow(g,x,y,r,col,a){r=Math.max(2,Math.round(r));const s=this.glowSpr(this.hc(col),r);g.globalAlpha=a;g.drawImage(s,Math.round(x-r),Math.round(y-r));g.globalAlpha=1;}
  /* a 5-point pixel star (critical hits) */
  star(g,x,y,s,c){x|=0;y|=0;g.fillStyle=c;g.fillRect(x-s,y,s*2+1,1);g.fillRect(x,y-s,1,s*2+1);if(s>1){g.fillRect(x-1,y-1,3,3);g.fillRect(x-s+1,y+s-1,1,1);g.fillRect(x+s-1,y+s-1,1,1);}}
  drawBack(g,cxm,cym){ // under the characters: ground rings, crystals, beams' outer glow
    for(const c of this.CR)if(c.on&&!c.shattered){const k=Math.min(1,c.t/c.grow),h=Math.round(c.h*k),X=c.x-cxm,Y=c.y-cym;
      for(let i=0;i<h;i++){const u=i/c.h,w=Math.max(1,Math.round(c.w*(1-u)*(.6+.4*k))),xx=Math.round(X+c.lean*i);
        g.fillStyle=this.hc('#4a8ad8');g.fillRect(xx-w,Y-i,w*2,1);g.fillStyle=this.hc('#a6ecff');g.fillRect(xx-w+1,Y-i,Math.max(1,w-1),1);g.fillStyle='#ffffff';if(i%5===0||u>.85)g.fillRect(xx-1,Y-i,1,1);}
      g.globalCompositeOperation='lighter';this.glow(g,X,Y-h*.6,10,'#8fd8ff',.5);g.globalCompositeOperation='source-over';}}
  draw(g,cxm,cym){
    // after-images (normal blend, tinted silhouettes)

/* ---- background: night castle, two parallax layers, flagstone floor ---- */
const BG=document.createElement('canvas');function makeBG(){BG.width=W*2;BG.height=H;const g=BG.getContext('2d');const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0b0a1c');gr.addColorStop(1,'#1c1830');g.fillStyle=gr;g.fillRect(0,0,W*2,H);
  for(let i=0;i<70;i++){g.fillStyle=i%5?'#3a3a5a':'#8a8ab0';g.fillRect((Math.random()*W*2)|0,(Math.random()*120)|0,1,1);}
  g.fillStyle='#14122a';for(let x=0;x<W*2;x+=48){const h=60+((x*7)%50);g.fillRect(x,FLOOR-h,30,h);g.fillRect(x+10,FLOOR-h-14,10,14);for(let k=0;k<3;k++)g.fillRect(x+2+k*10,FLOOR-h-4,6,4);}
  g.fillStyle='#e6cf8f';for(let x=20;x<W*2;x+=96){g.fillRect(x,FLOOR-80,2,3);}}
/* portrait phones: the logical screen gets taller (never wider), so nothing is stretched */

  const ox2=-(camX*.6)%64;g.fillStyle='#1e1a32';for(let x=ox2-64;x<W+64;x+=64){g.fillRect(Math.round(x),40,14,FLOOR-40);g.fillStyle='#2a2440';g.fillRect(Math.round(x)+2,40,3,FLOOR-40);g.fillStyle='#1e1a32';}
  for(let x=-(camX%16)-16;x<W;x+=16){g.fillStyle='#2c2838';g.fillRect(Math.round(x),FLOOR,16,H-FLOOR);g.fillStyle='#4a4458';g.fillRect(Math.round(x),FLOOR,15,1);g.fillStyle='#1a1624';g.fillRect(Math.round(x)+15,FLOOR,1,H-FLOOR);g.fillRect(Math.round(x),FLOOR+12,16,1);}}

/* ===================== main loop ===================== */
function update(){frame++;
  if(FX.screen.hitstop>0){FX.screen.hitstop--;FX.screen.shake*=.95;return;}
  // input → attack
  if(PR.a&&!busy())ATK[cur].run();
  else if(PR.a&&P.act&&P.act.name==='combo'&&P.act.i>=2)ATK[1].run();
  if(!busy()||P.act.name==='combo'){const mx=(K.r?1:0)-(K.l?1:0);if(mx&&!busy()){P.vx+=(mx*2.2-P.vx)*.35;P.dir=mx;}else if(!busy())P.vx*=.7;}
  if(PR.j&&P.onG&&!busy()){P.vy=-5.2;P.onG=false;sq(.72,1.32);}
  for(const k in PR)PR[k]=0;
  stepAct();if(busy()&&P.act.name!=='dash'&&P.act.name!=='dive')P.vx*=.82;
  // physics
  P.vy=Math.min(P.vy+.3,9);P.x=clamp(P.x+P.vx,10,STW-10);P.y+=P.vy;const wasG=P.onG;P.onG=false;
  if(P.y+P.h>=FLOOR){P.y=FLOOR-P.h;if(P.vy>2.5&&!wasG)sq(1.35,.72);P.vy=0;P.onG=true;}
  P.sqx+=(1-P.sqx)*.22;P.sqy+=(1-P.sqy)*.22;
  // projectiles
  for(let i=PROJ.length-1;i>=0;i--){const o=PROJ[i];o.x+=o.vx;o.y+=o.vy;o.life--;o.trail.unshift([o.x,o.y]);if(o.trail.length>12)o.trail.pop();
    FX.p({x:o.x-o.dir*rnd(2,6),y:o.y+rnd(-3,3),vx:-o.dir*rnd(.2,.8),vy:rnd(-.3,.3),life:10,cols:['#ffffff','#bff8ff','#49c8ff'],shape:'spark'});
